server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/foodmonitoring
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false
  main:
    allow-circular-references: true
    allow-bean-definition-overriding: true
  jackson:
    serialization:
      indent-output: true
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  security:
    user:
      name: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin123}
      roles: ADMIN

logging:
  level:
    org:
      springframework:
        security: DEBUG

jwt:
  expiration: 3600000 # 1 час в миллисекундах
