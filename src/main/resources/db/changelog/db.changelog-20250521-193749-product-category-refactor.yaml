databaseChangeLog:
  - changeSet:
      id: 20250521-193749-1 # Unique ID using timestamp
      author: vyntyk5
      preConditions:
        - onFail: MARK_RAN
        - columnExists:
            tableName: products
            columnName: category
      changes:
        - dropColumn:
            tableName: products
            columnName: category
  - changeSet:
      id: 20250521-193749-2 # Unique ID
      author: vyntyk5
      preConditions:
        - onFail: MARK_RAN
        - not:
            columnExists:
              tableName: products
              columnName: category_id
      changes:
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false # Category can be optional
  - changeSet:
      id: 20250521-193749-3 # Unique ID
      author: vyntyk5
      preConditions:
        - onFail: MARK_RAN
        - not:
            foreignKeyConstraintExists:
              foreignKeyName: fk_products_categories
              # Можно добавить schemaName: public при необходимости
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: category_id
            baseTableName: products
            constraintName: fk_products_categories # Descriptive name
            referencedColumnNames: id
            referencedTableName: categories
            # onDelete: SET NULL # Default NO ACTION is fine
            # onUpdate: CASCADE
  - changeSet:
      id: 1
      author: vyntyk4
      preConditions:
        - onFail: MARK_RAN
        - not:
            tableExists:
              tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: 1-insert-role-user
      author: vyntyk2
      preConditions:
        - onFail: MARK_RAN
        - and:
            - tableExists:
                tableName: roles
            - sqlCheck:
                expectedResult: "0"
                sql: "SELECT COUNT(*) FROM roles WHERE name = 'ROLE_USER'"
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_USER
